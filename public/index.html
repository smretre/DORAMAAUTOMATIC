<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Premium</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"> 
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    :root { --bg: #050816; --card: #10172d; --card2: #111c3b; --blue: #247cff; --red: #ff234f; --text: #ffffff; --muted: #9ca3af; --green: #008000; }
    body { background: radial-gradient(circle at top right, rgba(36,124,255,0.15), transparent 20%), radial-gradient(circle at bottom left, rgba(255,35,79,0.12), transparent 25%), var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: 90px; }
    .container { width: 100%; max-width: 1400px; margin: auto; padding: 20px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; gap: 15px; }
    .menu-wrapper { position: relative; }
    .top-menu-btn { width: 60px; height: 60px; border: none; border-radius: 20px; background: linear-gradient(135deg, rgba(255, 35, 79, 0), rgba(36, 124, 255, 0)); color: white; font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(36,124,255,0.25); }
    .menu-dropdown { position: absolute; top: 75px; right: 0; width: 240px; background: #111c3b; border-radius: 20px; overflow: hidden; display: none; border: 1px solid rgba(255,255,255,0.08); z-index: 9999; backdrop-filter: blur(20px); }
    .menu-dropdown a { display: block; padding: 16px 20px; color: white; text-decoration: none; transition: 0.2s; }
    .menu-dropdown a:hover { background: rgba(255,255,255,0.05); }
    .logo { font-size: 30px; font-weight: 800; background: linear-gradient(90deg, var(--red), var(--blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; flex: 1; }
    .search-box { flex: 1; max-width: 450px; position: relative; margin-bottom: 25px; }
    .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.5); z-index: 2; }
    .search-box input { width: 100%; height: 52px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.05); color: white; padding: 0 20px 0 50px; font-size: 15px; outline: none; }
    .categories { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 28px; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .category { min-width: fit-content; padding: 12px 18px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); cursor: pointer; font-size: 14px; }
    .category.active, .category:hover { background: linear-gradient(rgba(0,0,255,.4), rgba(0,0,255,.4)); }
    .section-title { font-size: 28px; margin-bottom: 20px; font-weight: 800; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
    .card { background: linear-gradient(180deg, var(--card2), var(--card)); border-radius: 26px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
    .card-image { width: 100%; height: 300px; object-fit: cover; background: #0c1327; }
    .badge { position: absolute; top: 15px; left: 15px; background: rgba(36,124,255,0.8); padding: 6px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; z-index: 2; }
    .card-content { padding: 18px; }
    .card-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; min-height: 40px; }
    .price { font-size: 22px; font-weight: 800; color: #63a6ff; margin-bottom: 12px; }
    .buy-btn { width: 100%; height: 45px; border-radius: 14px; border: none; cursor: pointer; color: white; font-size: 14px; font-weight: 700; background: #247cff; transition: 0.2s; }
    .buy-btn.added { background: #008000; }
    
    /* Barra Fixa do Carrinho */
    #cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #111c3b; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; backdrop-filter: blur(10px); }
    #checkout-btn { background: #22c55e; color: #fff; border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 15px; }
    .loading { text-align: center; padding: 40px; color: #9ca3af; }
  </style>
</head>
<body>  
  <div class="container">
    <div class="topbar">
      <div class="logo"><i class="fa-solid fa-fire"></i> DORAMAX</div>
      <div class="menu-wrapper">
        <button class="top-menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i></button>
        <div class="menu-dropdown" id="menuDropdown">
          <a href="https://t.me/doramaasmax" target="_blank"><i class="fa-solid fa-users"></i> Grupo</a>
          <a href="https://t.me/CatalogoMinidramasSeries" target="_blank"><i class="fa-brands fa-telegram"></i> Canal</a>
        </div>
      </div>
    </div>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" placeholder="Pesquisar conteúdo...">
    </div>

    <div class="categories">
      <div class="category active" data-cat="todos">Todos</div>
      <div class="category" data-cat="top">Top</div>
      <div class="category" data-cat="novos">Novos</div>
      <div class="category" data-cat="dublados">Dublados</div>
      <div class="category" data-cat="vip">VIP</div>
    </div>

    <h2 class="section-title" id="catalogo">Catálogo Completo</h2>
    <div class="loading" id="loading">Carregando catálogo da planilha...</div>
    <div class="grid" id="catalogGrid"></div>
  </div>

  <!-- Barra do Carrinho Inferior -->
  <div id="cart-bar">
    <div>
      🛒 <span id="cart-count">0</span> série(s) | Total: R$ <span id="cart-total">0.00</span>
      <div style="font-size: 11px; color: #22c55e;" id="desconto-info">Desconto progressivo aplicado</div>
    </div>
    <button id="checkout-btn" onclick="finalizarCompra()">Finalizar Pedido</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let catalogData = [];
    let cart = [];

    function toggleMenu() {
       const menu = document.getElementById('menuDropdown');
       menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    const API_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTGeP0x7xeK7nHej7VxXBaM8OkFocnEjkH04IDrP0dzgoBVENtAtL1zSoQn_Z4sIhcBl0Bx5mIK3y8m/pub?output=csv';

    async function loadCatalog() {
      try {
        const response = await fetch(API_URL);
        const csv = await response.text();
        const linhas = csv.split('\n');
        const headers = linhas[0].split(',').map(h => h.trim().toLowerCase());

        catalogData = linhas.slice(1).map((linha, index) => {
          const valores = linha.split(',');
          let obj = { id: String(index) };
          headers.forEach((header, i) => {
            obj[header] = valores[i]?.trim();
          });
          return obj;
        }).filter(item => item.titulo);

        renderCatalog(catalogData);
      } catch(error) {
        console.error(error);
        document.getElementById('loading').innerHTML = 'Erro ao carregar catálogo.';
      }
    }

    function renderCatalog(data) {
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = '';

      data.forEach(item => {
        const precoLimpo = item.preco ? item.preco.replace(',', '.') : '6.00';
        const noCarrinho = cart.some(c => c.id === item.id);

        grid.innerHTML += `
          <div class="card" data-categoria="${item.categoria?.toLowerCase() || 'todos'}">
            <div class="badge">VIP</div>
            <img class="card-image" src="${item.imagem}" alt="${item.titulo}">
            <div class="card-content">
              <div class="card-title">${item.titulo}</div>
              <div class="price">R$ ${Number(precoLimpo).toFixed(2)}</div>
              <button class="buy-btn ${noCarrinho ? 'added' : ''}" onclick="alternarCarrinho('${item.id}')">
                ${noCarrinho ? 'Remover do Carrinho' : 'Adicionar ao Carrinho'}
              </button>
            </div>
          </div>
        `;
      });
      document.getElementById('loading').style.display = 'none';
    }

    function alternarCarrinho(id) {
      const index = cart.findIndex(c => c.id === id);
      if (index > -1) {
        cart.splice(index, 1);
      } else {
        const item = catalogData.find(i => i.id === id);
        if (item) cart.push(item);
      }
      renderCatalog(catalogData);
      atualizarCarrinhoBarra();
    }

    function atualizarCarrinhoBarra() {
      document.getElementById('cart-count').innerText = cart.length;
      
      let subtotal = cart.reduce((acc, item) => {
        let p = item.preco ? parseFloat(item.preco.replace(',', '.')) : 6.00;
        return acc + p;
      }, 0);

      // Regra de Desconto: 1ª série normal, 2ª -R$1, 3ª -R$2, etc.
      let desconto = Math.max(0, cart.length - 1);
      let totalFinal = Math.max(1, subtotal - desconto);

      document.getElementById('cart-total').innerText = totalFinal.toFixed(2);
      document.getElementById('desconto-info').innerText = desconto > 0 ? `Desconto progressivo: -R$ ${desconto}.00` : 'Adicione mais séries para ganhar desconto!';
    }

    async function finalizarCompra() {
      if (cart.length === 0) {
        alert('Selecione pelo menos uma série no carrinho!');
        return;
      }

      const user = tg.initDataUnsafe?.user || { id: 12345, username: 'usuario_teste' };

      const response = await fetch('/api/checkout', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          items: cart,
          userTelegramId: user.id,
          userUsername: user.username
        })
      });

      const data = await response.json();
      if (data.init_point) {
        window.location.href = data.init_point;
      } else {
        alert('Erro ao processar o pagamento.');
      }
    }

    // Filtros de categoria
    document.querySelectorAll('.category').forEach(cat => {
      cat.addEventListener('click', () => {
        document.querySelectorAll('.category').forEach(c => c.classList.remove('active'));
        cat.classList.add('active');
        const categoria = cat.dataset.cat;

        document.querySelectorAll('.card').forEach(card => {
          const cardCat = card.dataset.categoria;
          if (categoria === 'todos' || cardCat?.includes(categoria)) {
            card.style.display = 'block';
          } else {
            card.style.display = 'none';
          }
        });
      });
    });

    // Pesquisa
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const termo = e.target.value.toLowerCase();
      document.querySelectorAll('.card').forEach(card => {
        const titulo = card.querySelector('.card-title').textContent.toLowerCase();
        card.style.display = titulo.includes(termo) ? 'block' : 'none';
      });
    });

    loadCatalog();
  </script>
</body>
</html>
