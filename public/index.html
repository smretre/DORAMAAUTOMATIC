<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo Premium</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    :root { --bg: #050816; --card: #10172d; --card2: #111c3b; --blue: #247cff; --red: #ff234f; --text: #ffffff; --muted: #9ca3af; --green: #22c55e; }
    body { background: radial-gradient(circle at top right, rgba(36,124,255,0.15), transparent 20%), radial-gradient(circle at bottom left, rgba(255,35,79,0.12), transparent 25%), var(--bg); color: var(--text); overflow-x: hidden; padding-bottom: 90px; }
    .container { width: 100%; max-width: 1400px; margin: auto; padding: 20px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; gap: 15px; }
    .logo { font-size: 30px; font-weight: 800; background: linear-gradient(90deg, var(--red), var(--blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; flex: 1; }
    .search-box { flex: 1; max-width: 450px; position: relative; margin-bottom: 25px; }
    .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.5); z-index: 2; }
    .search-box input { width: 100%; height: 52px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.05); color: white; padding: 0 20px 0 50px; font-size: 15px; outline: none; }
    .section-title { font-size: 28px; margin-bottom: 20px; font-weight: 800; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 22px; }
    .card { background: linear-gradient(180deg, var(--card2), var(--card)); border-radius: 26px; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
    .card-image { width: 100%; height: 300px; object-fit: cover; background: #0c1327; }
    .badge { position: absolute; top: 15px; left: 15px; background: rgba(36,124,255,0.8); padding: 6px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; z-index: 2; }
    .card-content { padding: 18px; }
    .card-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; min-height: 40px; }
    .price { font-size: 22px; font-weight: 800; color: #63a6ff; margin-bottom: 12px; }
    .buy-btn { width: 100%; height: 45px; border-radius: 14px; border: none; cursor: pointer; color: white; font-size: 14px; font-weight: 700; background: #247cff; transition: 0.2s; }
    .buy-btn.added { background: #008000; }
    
    /* Barra Fixa do Carrinho */
    #cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #111c3b; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; backdrop-filter: blur(10px); }
    #checkout-btn { background: #22c55e; color: #fff; border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 15px; }
    
    /* Tela Modal do Pix (Estilo da imagem enviada) */
    #pix-modal { display: none; position: fixed; inset: 0; background: rgba(5,8,22,0.95); z-index: 2000; padding: 20px; overflow-y: auto; text-align: center; }
    .pix-content { max-width: 400px; margin: 30px auto; background: #111c3b; padding: 25px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); }
    .pix-content h2 { margin-bottom: 10px; font-size: 22px; }
    .qr-code-img { width: 220px; height: 220px; background: white; padding: 10px; border-radius: 12px; margin: 15px auto; object-fit: contain; }
    .copy-box { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; font-size: 11px; word-break: break-all; max-height: 80px; overflow-y: auto; margin-bottom: 15px; color: var(--muted); border: 1px solid rgba(255,255,255,0.08); }
    .btn-pix { width: 100%; height: 48px; border-radius: 14px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; }
    .btn-copy { background: #7c3aed; }
    .btn-paid { background: #22c55e; }
    .btn-cancel { background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,0.2); }
    .loading { text-align: center; padding: 40px; color: #9ca3af; }
  </style>
</head>
<body>  
  <div class="container">
    <div class="topbar">
      <div class="logo"><i class="fa-solid fa-fire"></i> DORAMAX</div>
    </div>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" placeholder="Pesquisar conteúdo...">
    </div>

    <h2 class="section-title" id="catalogo">Catálogo Completo</h2>
    <div class="loading" id="loading">Carregando catálogo da planilha...</div>
    <div class="grid" id="catalogGrid"></div>
  </div>

  <!-- Barra do Carrinho Inferior -->
  <div id="cart-bar">
    <div>
      🛒 <span id="cart-count">0</span> série(s) | Total: R$ <span id="cart-total">0.00</span>
    </div>
    <button id="checkout-btn" onclick="gerarPix()">Gerar PIX</button>
  </div>

  <!-- Tela Modal do Pix -->
  <div id="pix-modal">
    <div class="pix-content">
      <h2>Pagar com PIX</h2>
      <p id="pix-info-val" style="font-size: 14px; color: #63a6ff; margin-bottom: 10px;"></p>
      
      <img id="pix-qr" class="qr-code-img" src="" alt="QR Code Pix">
      
      <div class="copy-box" id="pix-copypaste"></div>
      
      <button class="btn-pix btn-copy" onclick="copiarCodigoPix()">
        <i class="fa-solid fa-copy"></i> Copiar código PIX
      </button>
      
      <p style="font-size: 11px; color: var(--muted); margin-bottom: 15px;">Após pagar no app do banco, toque no botão abaixo</p>
      
      <button id="btn-ja-paguei" class="btn-pix btn-paid" onclick="verificarPagamento()">
        ✓ Já Paguei
      </button>
      
      <button class="btn-pix btn-cancel" onclick="fecharModalPix()">
        Cancelar
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let catalogData = [];
    let cart = [];
    let currentPaymentId = null;
    let checkInterval = null;

    const API_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTGeP0x7xeK7nHej7VxXBaM8OkFocnEjkH04IDrP0dzgoBVENtAtL1zSoQn_Z4sIhcBl0Bx5mIK3y8m/pub?output=csv';

    async function loadCatalog() {
      try {
        const response = await fetch(API_URL);
        const csv = await response.text();
        const linhas = csv.split('\n');
        const headers = linhas[0].split(',').map(h => h.trim().toLowerCase());

        catalogData = linhas.slice(1).map((linha, index) => {
          const valores = linha.split(',');
          let obj = { id: String(index) };
          headers.forEach((header, i) => {
            obj[header] = valores[i]?.trim();
          });
          return obj;
        }).filter(item => item.titulo);

        renderCatalog(catalogData);
      } catch(error) {
        console.error(error);
        document.getElementById('loading').innerHTML = 'Erro ao carregar catálogo.';
      }
    }

    function renderCatalog(data) {
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = '';

      data.forEach(item => {
        const precoLimpo = item.preco ? item.preco.replace(',', '.') : '6.00';
        const noCarrinho = cart.some(c => c.id === item.id);

        grid.innerHTML += `
          <div class="card">
            <div class="badge">VIP</div>
            <img class="card-image" src="${item.imagem}" alt="${item.titulo}">
            <div class="card-content">
              <div class="card-title">${item.titulo}</div>
              <div class="price">R$ ${Number(precoLimpo).toFixed(2)}</div>
              <button class="buy-btn ${noCarrinho ? 'added' : ''}" onclick="alternarCarrinho('${item.id}')">
                ${noCarrinho ? 'Remover' : 'Adicionar ao Carrinho'}
              </button>
            </div>
          </div>
        `;
      });
      document.getElementById('loading').style.display = 'none';
    }

    function alternarCarrinho(id) {
      const index = cart.findIndex(c => c.id === id);
      if (index > -1) {
        cart.splice(index, 1);
      } else {
        const item = catalogData.find(i => i.id === id);
        if (item) cart.push(item);
      }
      renderCatalog(catalogData);
      atualizarCarrinhoBarra();
    }

    function atualizarCarrinhoBarra() {
      document.getElementById('cart-count').innerText = cart.length;
      let subtotal = cart.reduce((acc, item) => acc + parseFloat(item.preco?.replace(',', '.') || 6.00), 0);
      let desconto = Math.max(0, cart.length - 1);
      let totalFinal = Math.max(1, subtotal - desconto);
      document.getElementById('cart-total').innerText = totalFinal.toFixed(2);
    }

    async function gerarPix() {
      if (cart.length === 0) {
        alert('Selecione pelo menos uma série no carrinho!');
        return;
      }

      const user = tg.initDataUnsafe?.user || { id: 12345, username: 'usuario_teste' };

      // Altera o botão temporariamente para gerando
      const btnCheckout = document.getElementById('checkout-btn');
      btnCheckout.innerText = 'Gerando PIX...';
      btnCheckout.disabled = true;

      try {
        const response = await fetch('/api/checkout-pix', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ items: cart, userTelegramId: user.id, userUsername: user.username })
        });

        const data = await response.json();
        if (data.qrCodeBase64) {
          currentPaymentId = data.paymentId;
          document.getElementById('pix-qr').src = `data:image/png;base64,${data.qrCodeBase64}`;
          document.getElementById('pix-copypaste').innerText = data.qrCodeCopyPaste;
          document.getElementById('pix-info-val').innerText = `Carrinho (${cart.length} itens) — R$ ${data.totalFinal}`;
          document.getElementById('pix-modal').style.display = 'block';
        } else {
          alert('Erro ao gerar o Pix.');
        }
      } catch (e) {
        alert('Erro de conexão ao gerar Pix.');
      } finally {
        btnCheckout.innerText = 'Gerar PIX';
        btnCheckout.disabled = false;
      }
    }

    function copiarCodigoPix() {
      const texto = document.getElementById('pix-copypaste').innerText;
      navigator.clipboard.writeText(texto);
      alert('Código Pix Copia e Cola copiado com sucesso!');
    }

    async function verificarPagamento() {
      if (!currentPaymentId) return;

      const btn = document.getElementById('btn-ja-paguei');
      btn.innerText = 'Aguardando pagamento... ⏳';
      btn.disabled = true;

      // Faz uma verificação imediata e depois checa a cada 4 segundos
      checarStatusNaApi();
      checkInterval = setInterval(checarStatusNaApi, 4000);
    }

    async function checarStatusNaApi() {
      try {
        const res = await fetch(`/api/check-payment/${currentPaymentId}`);
        const data = await res.json();

        if (data.status === 'approved') {
          clearInterval(checkInterval);
          alert('Pagamento Aprovado com Sucesso!');
          window.location.reload();
        }
      } catch (e) {
        console.error('Erro ao verificar status');
      }
    }

    function fecharModalPix() {
      if (checkInterval) clearInterval(checkInterval);
      document.getElementById('pix-modal').style.display = 'none';
      const btn = document.getElementById('btn-ja-paguei');
      btn.innerText = '✓ Já Paguei';
      btn.disabled = false;
    }

    // Pesquisa simples
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const termo = e.target.value.toLowerCase();
      document.querySelectorAll('.card').forEach(card => {
        const titulo = card.querySelector('.card-title').textContent.toLowerCase();
        card.style.display = titulo.includes(termo) ? 'block' : 'none';
      });
    });

    loadCatalog();
  </script>
</body>
</html>
